name: Build Debian Package

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-deb:
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25.5.0"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build Debian package
        working-directory: desktop
        run: npm run build:electron:linux:${{ matrix.arch }}

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-router-deb-${{ matrix.arch }}
          path: desktop/release/**/linux/*.deb
          if-no-files-found: error

  release:
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all Debian package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: personal-ai-router-deb-*
          path: artifacts
          merge-multiple: true

      - name: Compute next version
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./desktop/package.json').version")
          MAJOR_MINOR="${BASE_VERSION%.*}"
          LATEST_TAG=$(git tag -l "v${MAJOR_MINOR}.*" --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_VERSION="v${BASE_VERSION}"
          else
            PATCH=$(echo "$LATEST_TAG" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+)$/\1/')
            NEXT_VERSION="v${MAJOR_MINOR}.$((PATCH + 1))"
          fi
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*.deb
